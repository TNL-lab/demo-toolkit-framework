name: Validate Commit Messages

permissions:
  contents: write

env:
  TOOLKIT_ROOT: tools/git/git-toolkit
  TOOLKIT_SCRIPTS: tools/git/git-toolkit/scripts

on:
  pull_request:
    branches: [main, develop]

jobs:
  commit-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Init & force update submodule
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Debug repo structure
        run: |
          pwd
          ls -la
          echo "Toolkit root:"
          ls -la "${{ env.TOOLKIT_ROOT }}" || true
          echo "Toolkit scripts:"
          ls -la "${{ env.TOOLKIT_SCRIPTS }}" || true

      - name: Setup tools permission
        run: |
          find "${{ env.TOOLKIT_SCRIPTS }}" -type f -name "*.sh" -exec chmod +x {} \;

      - name: Validate commit messages
        run: |
          TOOL="${{ env.TOOLKIT_SCRIPTS }}/verify-commit-message.sh"

          git log origin/${{ github.base_ref }}..HEAD --format=%s | while read msg; do
            echo "🔍 Checking: $msg"
            echo "$msg" | "$TOOL" -
          done
