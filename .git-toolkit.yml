toolkit:
  phase:
    required: false
    pattern: "^phase-[0-9]+$"
    tag_prefix: "toolkit-"

commit:
  allowed_types:
    - feat
    - fix
    - docs
    - test
    - refactor
    - chore
    - style

  allowed_scopes:
    - context
    - core
    - driver
    - api
    - ci
    - repo
    - tooling

release:
  dryRun: true
  semantic_groups:
    feat: "🚀 Features"
    fix: "🐞 Bug Fixes"
    docs: "📚 Documentation"
    test: "🧪 Tests"
    refactor: "♻️ Refactoring"
    chore: "🔧 Chores"
    style: "🎨 Style"

version:
  file: "VERSION"
