toolkit:
  phase:
    required: false
    pattern: "^phase-[0-9]+$"
    tag_prefix: "toolkit-phase"

commit:
  allowed_types:
    - feat
    - fix
    - docs
    - test
    - refactor
    - chore
    - style

  allowed_scopes:
    - context
    - core
    - driver
    - api
    - ci
    - repo
    - tooling

release:
  dryRun: false
  semantic_groups:
    feat: "🚀 Features"
    fix: "🐞 Bug Fixes"
    docs: "📚 Documentation"
    test: "🧪 Tests"
    refactor: "♻️ Refactoring"
    chore: "🔧 Chores"
    style: "🎨 Style"
  bump_rules:
    feat: minor
    fix: patch
    docs: none
    test: none
    refactor: patch
    chore: none
    style: none
  major_keyword: "BREAKING CHANGE"
  packages:
    list:
      api: packages/api/VERSION
      web: packages/web/VERSION
      core: packages/core/VERSION

version:
  file: "VERSION"
